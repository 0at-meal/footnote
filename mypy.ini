[mypy]
strict = true

# pymupdf ships with incomplete stubs (Document.__init__ is untyped).
# Suppressed here rather than with inline `# type: ignore` per CONSTITUTION §1.10.
[mypy-pymupdf]
ignore_missing_imports = True
disallow_untyped_calls = False

[mypy-fitz]
ignore_missing_imports = True
disallow_untyped_calls = False

# validation.py calls pymupdf.open() whose constructor is untyped in pymupdf's
# bundled stubs. The per-module override below disables untyped-call checking
# for this file only — all other strict rules remain active.
[mypy-app.ingestion.validation]
disallow_untyped_calls = False

[mypy-docling.*]
ignore_missing_imports = True

[mypy-docling_core.*]
ignore_missing_imports = True

[mypy-app.extraction.docling_parser]
disallow_untyped_calls = False

[mypy-app.extraction.coordinate_normalizer]
disallow_untyped_calls = False

[mypy-xlsxwriter.*]
ignore_missing_imports = True

[mypy-xlsxwriter]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-openpyxl]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-reportlab]
ignore_missing_imports = True

[mypy-app.audit_report.renderer]
disallow_subclassing_any = False

[mypy-eval.corpus_loader]
disallow_untyped_calls = False

[mypy-tests.eval.test_corpus_loader]
disallow_untyped_calls = False
