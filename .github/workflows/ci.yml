# Footnote CI: lint, format check, strict typing, tests.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
      - name: mypy (strict)
        run: python -m mypy
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
      - name: Gold-set inputs unchanged (sha256)
        working-directory: backend
        run: python -m tools.gold.fetch_releases --verify
      - name: Gold labels valid and complete (schema, manifest, P0-06 review)
        working-directory: backend
        run: python -m tools.gold.labels --validate --strict
      - name: Extractor scorer must not regress below the baseline (P0-10)
        working-directory: backend
        run: python -m tools.eval.score --check ../eval/thresholds.yaml
      - name: Bridge engine must not regress on the gold set (P2-14)
        working-directory: backend
        run: python -m tools.eval.score_bridge --check ../eval/thresholds-bridge.yaml
      - name: Agent eval questions valid (A-01)
        working-directory: backend
        run: python -m tools.agent_eval.questions --validate
