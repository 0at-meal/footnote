# Footnote CI (AUD-033): every gate from the plan's definition of done.
# Known red until later batches (deliberately not hidden with continue-on-error):
#   - eval: `--strict` fails until the corpus/gate are rebuilt (AUD-010/AUD-014, batch 6).
#   - backend pytest: 6 taxonomy tests need a versioned seed taxonomy (see docs/audit/FIX_PROGRESS.md).
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Ruff
        run: python -m ruff check backend eval tools
      - name: mypy (strict, root mypy.ini)
        run: python -m mypy backend/app
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc -b
      - name: Vitest
        run: npx vitest run
      - name: Build + production-bundle check (no dev-only/mock content)
        run: npm run verify:bundle

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Backend venv (the e2e config launches .venv/bin/python)
        run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright
        working-directory: frontend
        run: npx playwright test

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: python -m pip install -r requirements.txt
      - name: Eval regression gate (strict)
        run: python -m eval.run_benchmark --split dev --replay --strict --output-dir "${{ runner.temp }}/eval-reports"
