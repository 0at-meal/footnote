<title>Footnote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a credit terminal. Sticky top bar; the working area is a dense worksheet of 32px rows,
   figures in mono with auditor tick marks; filings open in a source panel from the right. */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --sunk: #eceef2;
  --ink: #14213d;
  --muted: #5a6478;
  --rule: #dde1e8;
  --rule-strong: #c3c9d4;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e6ecfb;
  --ok: #12734a;
  --ok-soft: #e1f1e9;
  --warn: #9a5a00;
  --warn-soft: #fbefd8;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --kept: #9aa3b2;
  --mix1: #14213d; --mix2: #1f4fd1; --mix3: #7d9be6; --mix4: #5a6478; --mix5: #b9c7ec; --mix6: #c3c9d4;
  --shadow: 0 12px 40px rgba(20, 33, 61, 0.18);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --row: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1320; --panel: #141c2d; --sunk: #10182a; --ink: #e3e8f1; --muted: #93a0b5; --rule: #243049; --rule-strong: #34425f;
    --accent: #7ea2ff; --accent-ink: #0d1320; --accent-soft: #1b2a4d; --ok: #5fd39a; --ok-soft: #10301f; --warn: #f0b456; --warn-soft: #33270f;
    --bad: #ff8a80; --bad-soft: #3a1714; --kept: #5d6880;
    --mix1: #e3e8f1; --mix2: #7ea2ff; --mix3: #4a69b8; --mix4: #a9b4c8; --mix5: #33456e; --mix6: #66728a;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1320; --panel: #141c2d; --sunk: #10182a; --ink: #e3e8f1; --muted: #93a0b5; --rule: #243049; --rule-strong: #34425f;
  --accent: #7ea2ff; --accent-ink: #0d1320; --accent-soft: #1b2a4d; --ok: #5fd39a; --ok-soft: #10301f; --warn: #f0b456; --warn-soft: #33270f;
  --bad: #ff8a80; --bad-soft: #3a1714; --kept: #5d6880;
  --mix1: #e3e8f1; --mix2: #7ea2ff; --mix3: #4a69b8; --mix4: #a9b4c8; --mix5: #33456e; --mix6: #66728a;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .n, .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* ---------- top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: center; gap: 20px; min-height: 52px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto; }
.logo { display: inline-flex; align-items: flex-start; color: var(--ink); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
.logo:hover { text-decoration: none; }
.logo .fn { font-family: var(--font-num); font-size: 12px; color: var(--accent); margin-left: 1px; line-height: 1; padding-top: 2px; }
.tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs a { color: var(--muted); font-weight: 500; padding: 15px 12px 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.kbtn { display: inline-flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--rule); background: var(--sunk); color: var(--muted); border-radius: 6px; cursor: pointer; min-width: 240px; }
.kbtn:hover { border-color: var(--rule-strong); }
.kbtn span { flex: 1; text-align: left; }
kbd { font-family: var(--font-num); font-size: 11px; border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--panel); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--rule-strong); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { color: var(--accent-ink); opacity: 0.92; }
.icon-btn { width: 32px; padding: 0; justify-content: center; }

/* ---------- page */
main { max-width: 1480px; margin: 0 auto; padding-block: 20px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1 { font-size: 22px; font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 14px; font-weight: 600; margin: 0; text-wrap: balance; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 72ch; margin: 4px 0 0; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.panel-b { padding: 12px 14px; }
.empty { color: var(--muted); padding: 16px 14px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { color: var(--rule-strong); }

/* ---------- tables */
.tbl-wrap { overflow: auto; max-height: min(72vh, 760px); }
.tbl-wrap.free { max-height: none; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.grid th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; height: var(--row); padding: 0 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
table.grid td { height: var(--row); padding: 3px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.grid .n { text-align: right; white-space: nowrap; }
table.grid tbody tr:hover td { background: var(--sunk); }
table.grid tr.hl td, table.grid tbody tr.hl:hover td { background: var(--accent-soft); }
table.grid tr.sub td { color: var(--muted); }
table.grid tr.start td { font-weight: 500; }
table.grid tr.total td { font-weight: 600; border-top: 1.5px solid var(--ink); }
table.grid tfoot td { font-weight: 600; background: var(--sunk); }
table.grid tr.click { cursor: pointer; }
th button.sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; }
th button.sort:focus-visible { outline: 2px solid var(--accent); }
th.n button.sort { justify-content: flex-end; }
.num { background: none; border: 0; padding: 2px 4px; margin: -2px -4px; border-radius: 3px; cursor: pointer; color: var(--ink); }
.num:hover { background: var(--accent-soft); color: var(--accent); }
.lbl { min-width: 220px; }

/* ---------- chips and ticks */
.chip { display: inline-block; font-family: var(--font-num); font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 3px; background: var(--sunk); color: var(--muted); white-space: nowrap; border: 1px solid var(--rule); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.code { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
.ticks { display: inline-flex; gap: 12px; flex-wrap: wrap; }
.tick { font-size: 12px; white-space: nowrap; }
.tick b { font-family: var(--font-num); font-weight: 600; }
.tick.ok b { color: var(--ok); } .tick.bad b { color: var(--bad); } .tick.warn b { color: var(--warn); }

/* ---------- changes inbox */
.inbox { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
.inbox-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.stat { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--rule); }
.stat .v { font-family: var(--font-num); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat .l { font-weight: 500; }
.stat .d { font-size: 12px; color: var(--muted); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
select, input[type="text"], input[type="search"] { font: inherit; height: 32px; padding: 0 8px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--panel); color: var(--ink); }
.filters .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
.day { display: flex; flex-direction: column; gap: 6px; }
.day-h { display: flex; gap: 8px; align-items: baseline; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 0 2px; border-bottom: 1px solid var(--rule); }
.day-h .mono { color: var(--ink); }
.card { display: grid; grid-template-columns: 4px 72px minmax(0, 1fr) auto 64px; align-items: stretch; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; cursor: pointer; min-height: 52px; }
.card:hover { border-color: var(--rule-strong); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .strip-c { background: var(--kept); }
.card.t-red .strip-c { background: var(--bad); }
.card.t-amber .strip-c { background: var(--warn); }
.card.t-blue .strip-c { background: var(--accent); }
.card .tk { align-self: center; padding: 0 10px 0 12px; font-family: var(--font-num); font-weight: 600; color: var(--ink); }
.card .body { padding: 8px 8px; min-width: 0; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.card .type { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--muted); }
.card.t-red .type { color: var(--bad); } .card.t-amber .type { color: var(--warn); } .card.t-blue .type { color: var(--accent); }
.card .desc { overflow-wrap: anywhere; }
.card .nums { align-self: center; padding: 0 12px; font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 13px; }
.card .nums .arrow { color: var(--muted); padding: 0 4px; }
.card .nums .dl { display: block; font-size: 11.5px; color: var(--muted); }
.card .src { align-self: center; justify-self: end; padding-right: 12px; font-size: 12px; white-space: nowrap; }
.fold { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); padding: 6px 10px; border: 1px dashed var(--rule-strong); border-radius: 6px; }
.fold:hover { color: var(--ink); border-color: var(--muted); }
.fold:focus-visible { outline: 2px solid var(--accent); }
.more { align-self: center; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 14px; }
.watch li { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 20px; gap: 8px; align-items: center; height: var(--row); padding: 0 10px 0 14px; border-bottom: 1px solid var(--rule); }
.watch ul { list-style: none; margin: 0; padding: 0; }
.watch .t { font-family: var(--font-num); font-weight: 600; color: var(--ink); cursor: pointer; }
.watch .nm { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.watch .x { all: unset; cursor: pointer; color: var(--muted); text-align: center; border-radius: 3px; }
.watch .x:hover { color: var(--bad); }
.watch .x:focus-visible { outline: 2px solid var(--accent); }
.watch form { display: flex; gap: 6px; padding: 10px 14px; }
.watch form input { flex: 1; min-width: 0; text-transform: uppercase; }

/* ---------- issuer */
.ihead { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; justify-content: space-between; }
.ihead .ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, auto)) minmax(0, 1fr); gap: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.fig { padding: 10px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fig + .fig { border-left: 1px solid var(--rule); }
.fig .v { font-family: var(--font-num); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.fig .v.btn-v { cursor: pointer; }
.fig .l { font-size: 12px; color: var(--muted); }
.fig.checks { justify-content: center; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 0 10px; height: 28px; cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button.on { background: var(--ink); color: var(--panel); }
svg { display: block; max-width: 100%; height: auto; }
svg text { fill: var(--muted); font-family: var(--font-num); font-size: 10.5px; }
svg text.ink { fill: var(--ink); }
.wf-row { cursor: pointer; }
.wf-row:hover .hit, .wf-row.hl .hit { fill: var(--accent-soft); }
.wf-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 14px 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.lg-line { display: inline-block; width: 16px; border-top: 2px solid var(--ink); vertical-align: middle; margin-right: 5px; }
.lg-line.b { border-top: 2px dashed var(--accent); }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); padding: 0 8px; overflow-x: auto; }
.subtabs button { border: 0; background: none; padding: 10px 10px 8px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.subtabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); padding: 10px 14px; border-top: 1px solid var(--rule); max-width: 110ch; }

/* ---------- source viewer */
.viewer { position: fixed; top: 0; right: 0; bottom: 0; width: 45vw; min-width: 420px; z-index: 40; background: var(--panel); border-left: 1px solid var(--rule-strong); box-shadow: var(--shadow); display: flex; flex-direction: column; transform: translateX(104%); visibility: hidden; transition: transform 220ms ease, visibility 0s linear 220ms; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.viewer.open { transform: none; visibility: visible; transition: transform 220ms ease; }
.v-head { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.v-head .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.v-head .ttl { font-weight: 600; overflow-wrap: anywhere; }
.v-head dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; margin: 0; font-size: 12px; }
.v-head dt { color: var(--muted); }
.v-head dd { margin: 0; font-family: var(--font-num); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-line { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 8px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--rule); background: var(--sunk); }
.v-line strong { color: var(--ink); font-family: var(--font-num); font-weight: 600; }
.v-body { flex: 1; overflow: auto; padding: 12px 16px 24px; }
.v-table table { border-collapse: collapse; font-size: 12px; font-family: var(--font-ui); }
.v-table td, .v-table th { padding: 2px 4px; border-bottom: 1px solid var(--rule); white-space: nowrap; text-align: left; font-weight: 400; }
.v-table tr > td:first-child { position: sticky; left: 0; background: var(--panel); max-width: min(280px, 42vw); overflow: hidden; text-overflow: ellipsis; box-shadow: 1px 0 0 var(--rule); }
.v-table td.r { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.v-table td[data-fn-xp] { cursor: pointer; }
.v-table td[data-fn-xp]:hover { background: var(--sunk); }
.v-table tr.src-row td { background: var(--accent-soft); }
.v-table td.src-hit { background: var(--accent) !important; color: var(--accent-ink); font-weight: 600; outline: 2px solid var(--accent); }
.v-msg { color: var(--muted); max-width: 60ch; }

/* ---------- compare */
.cmp-ctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pick .chip { font-size: 12px; line-height: 26px; padding: 0 4px 0 8px; color: var(--ink); background: var(--panel); border-color: var(--rule-strong); display: inline-flex; gap: 4px; align-items: center; }
.pick .chip button { all: unset; cursor: pointer; color: var(--muted); padding: 0 4px; }
.pick .chip button:hover { color: var(--bad); }
.mixbar { display: flex; height: 12px; width: 160px; border-radius: 2px; overflow: hidden; background: var(--sunk); }
.mixbar span { display: block; height: 100%; }
.sm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.sm { margin: 0; padding: 10px 12px 6px; }
.sm figcaption { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.sm figcaption b { font-family: var(--font-num); color: var(--ink); }

/* ---------- method */
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.prose { padding: 12px 14px; }
.prose ol, .prose ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
.callout { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* ---------- palette and demo */
.pal-back { position: fixed; inset: 0; z-index: 60; background: rgba(13, 19, 32, 0.38); display: flex; justify-content: center; align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 12vh) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.pal { width: 560px; max-width: 100%; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.pal input { width: 100%; height: 48px; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 0 16px; font-size: 15px; }
.pal input:focus-visible { outline: none; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.pal li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; height: 34px; padding: 0 10px; border-radius: 6px; cursor: pointer; }
.pal li b { font-family: var(--font-num); }
.pal li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal li.on { background: var(--accent-soft); }
.pal .foot { font-size: 12px; color: var(--muted); padding: 8px 16px; border-top: 1px solid var(--rule); }
.demo { position: fixed; z-index: 50; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 420px; max-width: calc(100vw - 32px); background: var(--ink); color: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.demo .k { font-family: var(--font-num); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
.demo p { margin: 0; line-height: 1.5; }
.demo .ctl { display: flex; gap: 8px; justify-content: flex-end; }
.demo .ctl button { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid currentColor; background: transparent; color: var(--panel); cursor: pointer; }
.demo .ctl button.go { background: var(--panel); color: var(--ink); border-color: var(--panel); font-weight: 600; }
.demo .ctl button:disabled { opacity: 0.4; cursor: default; }
.toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 6px; font-size: 12.5px; }

@media (max-width: 1100px) {
  .inbox { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .top-in { flex-wrap: wrap; gap: 0 12px; }
  .tabs { order: 3; width: 100%; margin: 0 -4px; }
  .tabs a { padding: 9px 8px 8px; }
  .kbtn { min-width: 0; }
  .kbtn span, .kbtn kbd { display: none; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat .v { font-size: 19px; }
  .stat:nth-child(n + 3) { border-top: 1px solid var(--rule); }
  .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fig.checks { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--rule); }
  .fig { padding: 8px 12px; }
  .fig .v { font-size: 17px; }
  .cols2 { grid-template-columns: minmax(0, 1fr); }
  .viewer { width: 100vw; min-width: 0; padding-left: env(safe-area-inset-left, 0px); }
  .v-head { flex-wrap: wrap; }
  .v-head .meta { flex: 1 1 calc(100% - 48px); }
  #vSec { order: 3; }
  .card { grid-template-columns: 4px 60px minmax(0, 1fr); grid-template-rows: auto auto; }
  .card .strip-c { grid-row: 1 / 3; }
  .card .tk { grid-row: 1 / 3; padding: 0 8px 0 10px; }
  .card .nums { grid-column: 3; text-align: left; padding: 0 8px 8px; }
  .card .nums .dl { display: inline; margin-left: 8px; }
  .card .src { display: none; }
  .lbl { min-width: 160px; }
  .kb { display: none; }
}
@media (prefers-reduced-motion: reduce) { .viewer, .viewer.open { transition: none; } }
</style>

<header class="top">
  <div class="top-in">
    <a class="logo" href="#changes" aria-label="Footnote, changes inbox">Footnote<span class="fn">¹</span></a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#changes" data-v="changes">Changes</a>
      <a href="#issuers" data-v="issuers">Issuers</a>
      <a href="#compare" data-v="compare">Compare</a>
      <a href="#method" data-v="method">Method</a>
    </nav>
    <div class="top-tools">
      <button type="button" class="kbtn" id="openK" aria-label="Search issuers"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg><span>Search ticker or name</span><kbd>Ctrl K</kbd></button>
      <button type="button" class="btn" id="demoBtn">Demo</button>
      <button type="button" class="btn icon-btn" id="themeBtn" aria-label="Switch light or dark theme" title="Switch light or dark theme"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>
<main id="main"><div class="empty">Loading the record…</div></main>

<aside class="viewer" id="viewer" aria-label="Source filing" aria-hidden="true">
  <div class="v-head">
    <div class="meta">
      <div class="eyebrow">Source table, as filed</div>
      <div class="ttl" id="vTitle"></div>
      <dl id="vMeta"></dl>
    </div>
    <a class="btn" id="vSec" href="#" target="_blank" rel="noopener">Open on sec.gov ↗</a>
    <button type="button" class="btn icon-btn" id="vClose" aria-label="Close source viewer">✕</button>
  </div>
  <div class="v-line" id="vLine"></div>
  <div class="v-body" id="vBody"></div>
</aside>

<div class="pal-back" id="palette" hidden>
  <div class="pal" role="dialog" aria-label="Search issuers">
    <input id="palq" type="text" placeholder="Search by ticker or name" autocomplete="off" spellcheck="false" aria-label="Search by ticker or name">
    <ul id="pall" role="listbox"></ul>
    <div class="foot">↑ ↓ to move · Enter to open · Esc to close</div>
  </div>
</div>

  <div class="k" id="demoK"></div>
  <p id="demoP"></p>
  <div class="ctl"><button type="button" id="demoExit">Exit</button><button type="button" id="demoPrev">Back</button><button type="button" class="go" id="demoNext">Next</button></div>
</div>

<script>
(() => {
  "use strict";
  let S = null, CODES = {}, BY = {};
  const MULT = { units: 1, thousands: 1e3, millions: 1e6, billions: 1e9 };
  const WATCH_DEFAULT = ["CC", "CZR", "MGM", "PENN", "WYNN", "CHTR", "LUMN", "CCL", "HTZ", "BHC"];
  const st = {
    view: "changes", ticker: null, period: null, tab: "recasts", policy: "v01", hl: null,
    f: { type: "", sector: "", watch: false, min: 0 }, sel: -1, open: {}, days: 30,
    cmp: { mode: "sector", sector: "Gaming & leisure", tickers: ["CZR", "MGM", "PENN"] },
    sort: { key: "gap", dir: -1 }, usector: "", uq: "",
  };
  let VIS = [];
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const main = $("#main");

  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory only */ } }
  let WATCH = lsGet("fn-watch", WATCH_DEFAULT);

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  // USD millions, one decimal, negatives in parentheses.
  function m(v, dp) {
    if (v == null || isNaN(v)) return "—";
    const x = v / 1e6, a = Math.abs(x), d = dp == null ? 1 : dp;
    const s = a.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
    return x < 0 ? "(" + s + ")" : s;
  }
  function capM(v) {
    if (v == null) return "—";
    const a = Math.abs(v) / 1e6;
    const s = "$" + (a >= 10 ? Math.round(a).toLocaleString("en-US") : a.toFixed(1)) + "m";
    return v < 0 ? "(" + s + ")" : s;
  }
  function pct(v) { if (v == null || isNaN(v)) return "—"; const s = Math.abs(v * 100).toFixed(1) + "%"; return v < 0 ? "(" + s + ")" : s; }
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function pp(pid) { const i = pid.indexOf("-"); const d = pid.slice(i + 1).split("-"); return { months: +pid.slice(0, i - 1), y: d[0], m: +d[1], day: +d[2] }; }
  function qlabel(pid) { const p = pp(pid); return (p.months === 3 ? "" : p.months + " months to ") + MON[p.m - 1] + " " + p.day + ", " + p.y; }
  function short(pid) { const p = pp(pid); const b = MON[p.m - 1] + " ’" + p.y.slice(2); return p.months === 3 ? b : p.months + "M " + b; }
  function dlabel(iso) { const d = new Date(iso + "T00:00:00Z"); return DOW[d.getUTCDay()] + " " + MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear(); }
  function ext(url, text, title) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener"' + (title ? ' title="' + esc(title) + '"' : "") + ">" + (text || "sec.gov ↗") + "</a>" : '<span class="muted">no link</span>'; }
  function latest(d) { return d.quarters.length ? d.quarters[d.quarters.length - 1] : null; }
  function quarter(d, pid) { return (pid && d.quarters.find((q) => q.period_id === pid)) || latest(d); }
  function threeM(d) { return d.quarters.filter((q) => pp(q.period_id).months === 3 && q.reported_usd != null); }
  function sumOk(q) { const c = q.sum_check; return !!c && Math.abs(Number(c.expected) - Number(c.computed)) <= Number(c.tolerance); }
  function checks(q) {
    const s = !q.sum_check ? ["warn", "○", "no sum check", "No sum check was run for this period"]
      : sumOk(q) ? ["ok", "✓", "adds up", "Start plus every adjustment equals the stated total (" + q.sum_check.computed + " vs " + q.sum_check.expected + ", tolerance " + q.sum_check.tolerance + ")"]
      : ["bad", "✗", "does not add up", "Start plus adjustments is " + q.sum_check.computed + ", the filing states " + q.sum_check.expected];
    const a = q.anchor_status === "pass" ? ["ok", "✓", "matches XBRL", "The GAAP starting line equals the company's XBRL fact for this period"]
      : q.anchor_status === "mismatch" ? ["bad", "✗", "differs from XBRL", "The GAAP starting line differs from the company's XBRL fact"]
      : ["warn", "○", "no XBRL fact", "XBRL has no comparable fact for this period"];
    return { s, a };
  }
  function tickHtml(q, compact) {
    const c = checks(q);
    return [c.s, c.a].map((t) => '<span class="tick ' + t[0] + '" title="' + esc(t[3]) + '"><b>' + t[1] + "</b>" + (compact ? "" : " " + t[2]) + "</span>").join("");
  }
  function codeName(c) { return CODES[c] ? CODES[c].name : c; }
  function nice(r) { const e = Math.pow(10, Math.floor(Math.log10(r || 1))); const f = r / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }
  function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }

  // Bridge lines joined to their normalization (category, treatment) by label + as-shown value.
  function enrich(q) {
    if (q._en) return q._en;
    const pool = {};
    q.normalization.lines.forEach((n) => { const k = n.label + "|" + n.value_raw; (pool[k] = pool[k] || []).push(n); });
    q._en = q.lines.map((l, i) => Object.assign({}, l, { li: i, n: l.role === "adjustment" ? ((pool[l.label + "|" + l.value_raw] || []).shift() || null) : null }));
    return q._en;
  }
  function lineUsd(l) { return l.value_usd == null ? null : l.sign * l.value_usd; }

  // ------------------------------------------------------------------ routing
  const VIEWS = ["changes", "issuers", "compare", "method"];
  function tok() { return st.view === "issuer" ? st.ticker + (st.period ? "_" + st.period : "") : st.view; }
  function go(view, o) {
    o = o || {};
    st.view = view;
    if (view === "issuer") { st.ticker = o.ticker; st.period = o.period || null; st.hl = o.hl || null; st.tab = o.tab || st.tab; }
    if (!o.keepViewer) closeViewer();
    const t = tok();
    if (decodeURIComponent(location.hash.slice(1)) !== t) location.hash = t;
    else { render(); if (!keepPlace()) window.scrollTo(0, 0); }
  }
  function keepPlace() { return st.view === "issuer" && !!st.hl; }
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (VIEWS.indexOf(h) >= 0) st.view = h;
    else if (h) {
      const i = h.indexOf("_"), t = (i < 0 ? h : h.slice(0, i)).toUpperCase(), p = i < 0 ? null : h.slice(i + 1);
      if (BY[t]) { if (st.ticker !== t) { st.hl = null; } st.view = "issuer"; st.ticker = t; st.period = p && BY[t].quarters.some((q) => q.period_id === p) ? p : null; }
      else st.view = "changes";
    } else st.view = "changes";
    render();
  }
  window.addEventListener("hashchange", () => { fromHash(); if (!keepPlace()) window.scrollTo(0, 0); });

  function render() {
    const tabv = st.view === "issuer" ? "issuers" : st.view;
    $$("#tabs a").forEach((a) => a.classList.toggle("on", a.getAttribute("data-v") === tabv));
    if (st.view === "issuer" && BY[st.ticker]) return viewIssuer(BY[st.ticker]);
    if (st.view === "issuers") return viewIssuers();
    if (st.view === "compare") return viewCompare();
    if (st.view === "method") return viewMethod();
    st.view = "changes";
    return viewChanges();
  }

  // ------------------------------------------------------------------ changes inbox
  const TYPES = {
    recast: { name: "Recast", cls: "t-red" },
    recurring_addback: { name: "Recurring “one-off”", cls: "t-amber" },
    added: { name: "Add-back added", cls: "t-blue" },
    removed: { name: "Add-back dropped", cls: "t-blue" },
    metric_renamed: { name: "Metric renamed", cls: "t-grey" },
    renamed: { name: "Line renamed", cls: "t-grey", fold: true },
    layout_changed: { name: "New layout", cls: "t-grey", fold: true },
  };
  const FT = { "": null, recast: ["recast"], recurring: ["recurring_addback"], addrop: ["added", "removed"], renamed: ["renamed", "metric_renamed", "layout_changed"] };
  const FT_NAMES = { "": "All change types", recast: "Recasts", recurring: "Recurring “one-offs”", addrop: "Added or dropped", renamed: "Renamed" };
  const MINS = [0, 1e6, 5e6, 10e6, 25e6, 100e6];

  function changeDesc(i) {
    const per = i.period_id ? qlabel(i.period_id) : "";
    if (i.type === "recast") return esc(i.label) + " for the " + (pp(i.period_id).months === 3 ? "quarter ended " : "") + esc(per) + ", first reported " + esc(i.first_filed);
    if (i.type === "recurring_addback") return esc(i.label) + ' <span class="chip code" title="' + esc(codeName(i.code)) + '">' + esc(i.code) + "</span> called non-recurring, seen in 3 of the last 4 quarters";
    if (i.type === "added") return "New add-back: " + esc(i.label);
    if (i.type === "removed") return "Add-back no longer shown: " + esc(i.label);
    if (i.type === "metric_renamed") return "Headline metric renamed: " + esc(i.prior_label) + " → " + esc(i.label);
    if (i.type === "layout_changed") return "Bridge layout changed: " + esc(i.value_raw);
    return esc(i.prior_label) + " → " + esc(i.label);
  }
  function changeNums(i) {
    if (i.before_usd == null && i.after_usd == null) return i.value_raw && i.type === "renamed" ? '<span class="muted">' + esc(i.value_raw) + "</span>" : "";
    const d = i.delta_usd;
    if (i.type === "recurring_addback") return m(i.after_usd) + '<span class="dl">$m this quarter</span>';
    return m(i.before_usd) + '<span class="arrow">→</span>' + m(i.after_usd) + '<span class="dl">Δ ' + (d != null && d > 0 ? "+" : "") + m(d) + " $m</span>";
  }
  function changeUrl(i) { return i.type === "recast" ? i.latest_url : i.url; }

  function filteredFeed() {
    const types = FT[st.f.type];
    const sectorOf = (t) => (BY[t] ? BY[t].sector : "");
    return S.feed.filter((i) =>
      (!types || types.indexOf(i.type) >= 0) &&
      (!st.f.sector || sectorOf(i.ticker) === st.f.sector) &&
      (!st.f.watch || WATCH.indexOf(i.ticker) >= 0) &&
      (!st.f.min || (i.impact_usd != null && i.impact_usd >= st.f.min)));
  }
  function headline() {
    const asOf = S.generated_at.slice(0, 10);
    const from = new Date(Date.parse(asOf + "T00:00:00Z") - 6 * 864e5).toISOString().slice(0, 10);
    let rel = 0, relOk = 0;
    S.issuers.forEach((d) => d.releases.forEach((r) => { if (r.filed >= from && r.filed <= asOf) { rel++; if (r.status !== "not_found") relOk++; } }));
    const nRec = S.feed.filter((i) => i.type === "recast").length;
    const recIss = new Set(S.feed.filter((i) => i.type === "recast").map((i) => i.ticker)).size;
    const nRecur = S.feed.filter((i) => i.type === "recurring_addback").length;
    const recurIss = new Set(S.feed.filter((i) => i.type === "recurring_addback").map((i) => i.ticker)).size;
    const c = S.coverage;
    const stat = (v, l, d) => '<div class="stat"><span class="v">' + v + '</span><span class="l">' + l + '</span><span class="d">' + d + "</span></div>";
    return '<div class="strip">' +
      stat(rel, "Releases this week", relOk + " with a bridge · " + MON[+from.slice(5, 7) - 1] + " " + +from.slice(8) + "–" + MON[+asOf.slice(5, 7) - 1] + " " + +asOf.slice(8)) +
      stat(nRec, "Recasts", "restated prior-period values at " + recIss + " issuers") +
      stat(nRecur, "Recurring “one-offs”", "non-recurring add-backs in 3 of 4 quarters, " + recurIss + " issuers") +
      stat(pct(c.bridges_found ? c.bridges_all_periods_tie / c.bridges_found : null), "Tie-out rate", c.bridges_all_periods_tie + " of " + c.bridges_found + " bridges add up in every period") +
      "</div>";
  }
  function card(i, k) {
    const T = TYPES[i.type] || { name: i.type, cls: "t-grey" };
    return '<article class="card ' + T.cls + (k === st.sel ? " sel" : "") + '" data-k="' + k + '" tabindex="-1">' +
      '<span class="strip-c"></span><span class="tk">' + esc(i.ticker) + "</span>" +
      '<div class="body"><span class="type">' + T.name + (i.period_id ? ' <span class="muted mono" style="text-transform:none;letter-spacing:0;font-weight:400">· ' + short(i.period_id) + "</span>" : "") + '</span><span class="desc">' + changeDesc(i) + "</span></div>" +
      '<div class="nums">' + changeNums(i) + "</div>" +
      '<span class="src">' + ext(changeUrl(i), "source ↗", "Open the line on sec.gov") + "</span></article>";
  }
  function viewChanges() {
    const items = filteredFeed();
    const byDay = {};
    items.forEach((i) => { const k = i.filed || "unknown"; (byDay[k] = byDay[k] || []).push(i); });
    const days = Object.keys(byDay).sort().reverse();
    VIS = [];
    const imp = (i) => (i.impact_usd == null ? -1 : i.impact_usd);
    const groups = days.slice(0, st.days).map((day) => {
      const list = byDay[day].slice().sort((a, b) => imp(b) - imp(a));
      const shown = list.filter((i) => !(TYPES[i.type] || {}).fold);
      const folded = list.filter((i) => (TYPES[i.type] || {}).fold);
      let h = '<section class="day"><div class="day-h"><span class="mono">' + (day === "unknown" ? "Filing date unknown" : dlabel(day)) + "</span><span>" + list.length + " change" + (list.length === 1 ? "" : "s") + "</span></div>";
      shown.forEach((i) => { h += card(i, VIS.length); VIS.push(i); });
      if (folded.length) {
        const open = !!st.open[day];
        h += '<button type="button" class="fold" data-fold="' + day + '" aria-expanded="' + open + '">' + (open ? "▾ Hide " : "▸ Show ") + folded.length + " renamed line" + (folded.length === 1 ? "" : "s") + "</button>";
        if (open) folded.forEach((i) => { h += card(i, VIS.length); VIS.push(i); });
      }
      return h + "</section>";
    }).join("");
    if (st.sel >= VIS.length) st.sel = VIS.length - 1;
    const sectors = Array.from(new Set(S.issuers.map((d) => d.sector).filter(Boolean))).sort();
    main.innerHTML =
      '<div><h1>What changed in the bridges</h1><p class="lede">Restated prior periods, add-backs that appear or vanish, renamed metrics, and “non-recurring” items that keep recurring, read from every earnings release and ranked by dollar impact.</p></div>' +
      '<div class="inbox"><div class="inbox-main">' + headline() +
      '<div class="filters">' +
      '<select id="fType" aria-label="Change type">' + Object.keys(FT).map((k) => '<option value="' + k + '"' + (st.f.type === k ? " selected" : "") + ">" + FT_NAMES[k] + "</option>").join("") + "</select>" +
      '<select id="fSector" aria-label="Sector"><option value="">All sectors</option>' + sectors.map((s) => "<option" + (st.f.sector === s ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select>" +
      '<select id="fMin" aria-label="Minimum dollar impact">' + MINS.map((v) => '<option value="' + v + '"' + (st.f.min === v ? " selected" : "") + ">" + (v ? "Impact ≥ " + capM(v) : "Any impact") + "</option>").join("") + "</select>" +
      '<label><input type="checkbox" id="fWatch"' + (st.f.watch ? " checked" : "") + "> Watchlist only</label>" +
      '<span class="count">' + items.length + " changes<span class=\"kb\"> · <kbd>J</kbd> <kbd>K</kbd> to move, <kbd>Enter</kbd> to open</span></span></div>" +
      (groups || '<div class="panel empty">No changes match these filters.</div>') +
      (days.length > st.days ? '<button type="button" class="btn more" data-more="1">Show earlier filing dates (' + (days.length - st.days) + " more)</button>" : "") +
      "</div>" + '<aside class="rail" id="rail">' + watchRail() + "</aside></div>";
    $("#fType").onchange = (e) => { st.f.type = e.target.value; st.sel = -1; viewChanges(); };
    $("#fSector").onchange = (e) => { st.f.sector = e.target.value; st.sel = -1; viewChanges(); };
    $("#fMin").onchange = (e) => { st.f.min = +e.target.value; st.sel = -1; viewChanges(); };
    $("#fWatch").onchange = (e) => { st.f.watch = e.target.checked; st.sel = -1; viewChanges(); };
    bindWatch();
  }
  function watchRail() {
    const rows = WATCH.filter((t) => BY[t]).map((t) => {
      const d = BY[t], q = latest(d);
      const n = S.feed.filter((i) => i.ticker === t && !(TYPES[i.type] || {}).fold).length;
      return '<li><span class="t" data-t="' + t + '" role="link" tabindex="0">' + t + '</span><span class="nm" title="' + esc(d.name) + '">' + (q ? n + " changes · " + short(q.period_id) : "no bridge yet") + "</span>" +
        '<span class="ticks">' + (q ? tickHtml(q, true) : "") + "</span>" +
        '<button type="button" class="x" data-unwatch="' + t + '" aria-label="Remove ' + t + ' from watchlist">×</button></li>';
    }).join("");

  function treat(n) { if (!n) return null; return st.policy === "asrep" ? "accept" : n.treatment; }
  const TREAT = { accept: ["Kept", ""], exclude: ["Reversed", "bad"], flag: ["Flagged", "warn"], review: ["Needs review", "warn"] };
  function bridgeTable(q) {

      '<tfoot><tr><td colspan="3">' + (st.policy === "asrep" ? "As reported" : "Footnote normalized") + '</td><td class="n">' + m(norm) + "</td><td></td></tr></tfoot></table></div>";
  }
  function bridgeNote(q) {

  }
  function waterfall(q) {
    if (q.start_usd == null || q.reported_usd == null) return '<div class="empty">This quarter has no GAAP starting value to build from.</div>';
    const L = enrich(q), asrep = st.policy === "asrep";
    const rows = [];
    const startL = L.find((l) => l.role === "gaap_start"), totL = L.find((l) => l.role === "total");
    let cum = q.start_usd;
    rows.push({ tot: true, code: "Start", name: q.start_label, a: 0, b: cum, li: startL ? startL.li : null, fill: "var(--ink)" });
    const rev = [];
    L.forEach((l) => {
      if (l.role !== "adjustment") return;
      const v = lineUsd(l);
      if (v == null || v === 0) return;
      const t = l.n ? l.n.treatment : "review";
      const fill = t === "exclude" && !asrep ? "var(--bad)" : t === "flag" || t === "review" ? "var(--warn)" : "var(--kept)";
      rows.push({ code: l.n ? l.n.code : "?", name: l.label, a: cum, b: cum + v, v, li: l.li, fill });
      cum += v;
      if (t === "exclude" && !asrep) rev.push({ l, v });
    });
    rows.push({ tot: true, code: "Reported", name: q.metric_label || "Reported", a: 0, b: q.reported_usd, li: totL ? totL.li : null, fill: "var(--ink)" });
    if (!asrep && q.normalized_usd != null) {
      let c = q.reported_usd;
      if (rev.length) rows.push({ sep: true });
      rev.forEach((r) => { rows.push({ code: "−" + r.l.n.code, name: "Reversed: " + r.l.label, a: c, b: c - r.v, v: -r.v, li: r.l.li, fill: "var(--bad)" }); c -= r.v; });
      rows.push({ tot: true, code: "Normalized", name: "Footnote normalized", a: 0, b: q.normalized_usd, li: null, fill: "var(--accent)" });
    }
    const vals = [0];
    rows.forEach((r) => { if (!r.sep) vals.push(r.a, r.b); });
    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const step = nice((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const W = 460, LW = 78, RW = 64, X0 = LW + 6, X1 = W - RW - 6, RH = 22, T = 6;
    const x = (v) => X0 + (X1 - X0) * (v - lo) / (hi - lo || 1);
    let y = T, g = "";
    const H = T + rows.reduce((s, r) => s + (r.sep ? 14 : RH + 3), 0) + 24;
    for (let t = lo; t <= hi + step / 2; t += step) {
      g += '<line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + T + '" y2="' + (H - 20) + '" stroke="var(--rule)" stroke-width="1"' + (Math.abs(t) < step / 1e6 ? "" : ' stroke-dasharray="2 3"') + "/>";
      g += '<text x="' + x(t) + '" y="' + (H - 6) + '" text-anchor="middle">' + m(t, Math.abs(step) >= 10e6 ? 0 : 1) + "</text>";
    }
    g += '<line x1="' + x(0) + '" x2="' + x(0) + '" y1="' + T + '" y2="' + (H - 20) + '" stroke="var(--rule-strong)" stroke-width="1"/>';
    let prev = null;
    rows.forEach((r) => {
      if (r.sep) { g += '<line x1="0" x2="' + W + '" y1="' + (y + 7) + '" y2="' + (y + 7) + '" stroke="var(--rule-strong)" stroke-dasharray="3 3"/>'; y += 14; prev = null; return; }
      const x1 = Math.min(x(r.a), x(r.b)), w = Math.max(1.5, Math.abs(x(r.b) - x(r.a)));
      if (prev != null && !r.tot) g += '<line x1="' + x(prev) + '" x2="' + x(prev) + '" y1="' + (y - 3) + '" y2="' + (y + 3) + '" stroke="var(--muted)" stroke-width="1"/>';
      const val = r.tot ? r.b : r.v;
      g += '<g class="wf-row" data-li="' + (r.li == null ? "" : r.li) + '"><title>' + esc(r.name) + ": " + m(val) + " $m</title>" +
        '<rect class="hit" x="0" y="' + (y - 1) + '" width="' + W + '" height="' + (RH + 2) + '" fill="transparent"/>' +
        '<text x="2" y="' + (y + RH / 2 + 4) + '" class="' + (r.tot ? "ink" : "") + '"' + (r.tot ? ' font-weight="600"' : "") + ">" + esc(r.code) + "</text>" +
        '<rect x="' + x1 + '" y="' + (y + 3) + '" width="' + w + '" height="' + (RH - 6) + '" rx="1.5" fill="' + r.fill + '"/>' +
        '<text x="' + (W - 2) + '" y="' + (y + RH / 2 + 4) + '" text-anchor="end" class="ink"' + (r.tot ? ' font-weight="600"' : "") + ">" + m(val) + "</text></g>";
      prev = r.b; y += RH + 3;
    });
    const legend = '<div class="wf-legend"><span><i class="sw" style="background:var(--kept)"></i>Kept add-back</span>' + (asrep ? "" : '<span><i class="sw" style="background:var(--bad)"></i>Reversed by policy</span>') + '<span><i class="sw" style="background:var(--warn)"></i>Flagged for review</span><span>$m</span></div>';
    return '<div class="panel-b" style="padding-bottom:4px"><svg id="wf" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" role="img" aria-label="Waterfall from the GAAP start to reported and normalized EBITDA">' + g + "</svg></div>" + legend;
  }
  function lineChart(qs, o) {
    if (qs.length < 2) return '<div class="empty" style="padding:8px 0">Fewer than two verified quarters.</div>';
    const W = o.W, H = o.H, L = o.L || 54, R = 22, T = 10, B = 22;
    const vals = [];
    qs.forEach((q) => { vals.push(q.reported_usd); if (q.normalized_usd != null) vals.push(q.normalized_usd); });
    let lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
    const step = nice((hi - lo) / (o.ticks || 3)); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
    const x = (i) => L + (W - L - R) * (i / (qs.length - 1));
    const y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    let g = "";
    qs.forEach((q, i) => { if (q.period_id === o.sel) g += '<rect x="' + (x(i) - 12) + '" y="' + T + '" width="24" height="' + (H - T - B) + '" fill="var(--accent-soft)"/>'; });
    for (let t = lo; t <= hi + step / 2; t += step) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="' + (Math.abs(t) < step / 1e6 ? "var(--rule-strong)" : "var(--rule)") + '" stroke-width="1"/>';
      g += '<text x="' + (L - 6) + '" y="' + (y(t) + 3.5) + '" text-anchor="end">' + m(t, step >= 10e6 ? 0 : 1) + "</text>";
    }
    const every = qs.length > 6 && W < 360 ? 2 : 1;
    qs.forEach((q, i) => { if ((qs.length - 1 - i) % every === 0) g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + short(q.period_id) + "</text>"; });
    const path = (key) => qs.map((q, i) => (q[key] == null ? "" : (i && qs[i - 1][key] != null ? "L" : "M") + x(i).toFixed(1) + " " + y(q[key]).toFixed(1))).join(" ");
    const area = path("reported_usd") + " L" + x(qs.length - 1) + " " + y(Math.max(lo, 0)) + " L" + x(0) + " " + y(Math.max(lo, 0)) + " Z";
    g += '<path d="' + area + '" fill="var(--accent-soft)" opacity="0.55"/>';
    g += '<path d="' + path("reported_usd") + '" fill="none" stroke="var(--ink)" stroke-width="1.75"/>';
    g += '<path d="' + path("normalized_usd") + '" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-dasharray="5 3"/>';
    qs.forEach((q, i) => {
      const last = i === qs.length - 1, attr = o.click ? ' data-qp="' + q.period_id + '" style="cursor:pointer"' : "";
      g += '<circle cx="' + x(i) + '" cy="' + y(q.reported_usd) + '" r="' + (last ? 4 : 2.75) + '" fill="var(--ink)"' + attr + "><title>" + short(q.period_id) + " reported " + m(q.reported_usd) + "</title></circle>";
      if (q.normalized_usd != null) g += '<circle cx="' + x(i) + '" cy="' + y(q.normalized_usd) + '" r="' + (last ? 4 : 2.75) + '" fill="var(--accent)"' + attr + "><title>" + short(q.period_id) + " normalized " + m(q.normalized_usd) + "</title></circle>";
    });
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" role="img" aria-label="' + esc(o.label) + '">' + g + "</svg>";
  }
  function trend(d, q) { return lineChart(threeM(d).slice(-8), { W: 460, H: 170, sel: q.period_id, click: true, label: "Reported and normalized EBITDA, last 8 quarters" }); }

  function lowerTabs(d) {

  // ------------------------------------------------------------------ source viewer
  const SRC = {};

  function getSource(acc) {
    if (SRC[acc]) return Promise.resolve(SRC[acc]);
    if (S.sources && S.sources[acc]) return Promise.resolve(SRC[acc] = S.sources[acc]);
    if (S.static) return Promise.resolve({ status: "not_embedded", reason: "This static copy embeds the filing table for each issuer's latest quarter only. Open the release on sec.gov for earlier quarters." });
    return fetch("api/source/" + encodeURIComponent(acc)).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then((j) => (SRC[acc] = j))
      .catch((e) => ({ status: "error", reason: "The table could not be loaded (" + e.message + ")." }));
  }
  function srcLines(q) { return enrich(q).filter((l) => l.xpath); }
  function openViewer(ticker, period, li) {
    const d = BY[ticker], q = quarter(d, period);
    const lines = srcLines(q);
    if (!lines.length) { toast("No source cells are stored for this quarter"); return; }
    if (!lines.some((l) => l.li === li)) li = lines[0].li;
    Object.assign(V, { open: true, ticker, period: q.period_id, li });
    const el = $("#viewer");
    el.classList.add("open"); el.setAttribute("aria-hidden", "false");

  function showViewer() {
    const d = BY[V.ticker], q = quarter(d, V.period), l = enrich(q)[V.li];
    $$("#main tr.hl:not(.hl-target)").forEach((r) => r.classList.remove("hl"));
    hlRow(V.li, true);
    const rel = d.releases.find((r) => r.accession === q.accession) || {};
    const lines = srcLines(q), pos = lines.findIndex((x) => x.li === V.li);
    $("#vTitle").textContent = d.ticker + " · " + l.label;
    $("#vLine").innerHTML = "As shown <strong>" + esc(l.value_raw) + "</strong> · $m <strong>" + m(lineUsd(l)) + "</strong> · " + esc(short(q.period_id)) + " column · line " + (pos + 1) + " of " + lines.length + ' · <kbd>↑</kbd> <kbd>↓</kbd> step · <kbd>Esc</kbd> close';
    $("#vSec").href = l.url || q.exhibit_url || "#";
    const meta = (src) => {
      const sha = (src && src.sha256) || "";
      $("#vMeta").innerHTML = "<dt>Accession</dt><dd>" + esc(q.accession) + "</dd><dt>Filed</dt><dd>" + esc(q.filed) + '</dd><dt>sha256</dt><dd title="' + esc(sha) + '">' + (sha ? esc(sha.slice(0, 16)) + "…" + esc(sha.slice(-8)) : '<span class="muted">not in this copy</span>') + "</dd>";
    };
    meta(null);
    const body = $("#vBody"), acc = q.accession;
    if (body.getAttribute("data-acc") !== acc) { body.innerHTML = '<div class="v-msg">Loading the filing table…</div>'; body.removeAttribute("data-acc"); }
    getSource(acc).then((src) => {
      if (!V.open || quarter(BY[V.ticker], V.period).accession !== acc) return;
      meta(src);
      if (src.status !== "ok") { body.removeAttribute("data-acc"); body.innerHTML = '<p class="v-msg"><strong>Table not shown.</strong> ' + esc(src.reason || src.status) + "</p>"; return; }
      if (body.getAttribute("data-acc") !== acc) {
        body.innerHTML = '<div class="v-table">' + src.table_html + "</div>";
        body.setAttribute("data-acc", acc);
        $$(".v-table td", body).forEach((td) => { if (/^[\s$€£()\d,.%−–—-]+$/.test(td.textContent) && /\d|—/.test(td.textContent)) td.classList.add("r"); });
      }
      $$(".src-hit, .src-row", body).forEach((e) => e.classList.remove("src-hit", "src-row"));
      const cell = Array.from(body.querySelectorAll("[data-fn-xp]")).find((c) => c.getAttribute("data-fn-xp") === l.xpath);
      if (!cell) { toast("This cell was not found in the stored table"); return; }
      cell.classList.add("src-hit"); cell.parentElement.classList.add("src-row");
      const cr = cell.getBoundingClientRect(), br = body.getBoundingClientRect();
      body.scrollTop += cr.top - br.top - body.clientHeight / 2 + cr.height / 2;
      const label = cell.parentElement.firstElementChild;
      const lw = label ? Math.min(label.getBoundingClientRect().width, body.clientWidth / 2) : 0;
      if (cr.right > br.right - 12 || cr.left < br.left + lw) body.scrollLeft += cr.left - br.left - lw - 40;
    });
  }

  function viewCompare() {

    const rows = tickers.map((t) => {
      const d = BY[t], q = latest(d), p = peerRow(t) || { mix_usd: {} };
      const rep = q ? q.reported_usd : null, norm = q ? q.normalized_usd : null;
      return { t, d, q, rep, norm, gap: rep && norm != null ? (rep - norm) / Math.abs(rep) : null, disc: q ? q.addback_intensity : null, mix: p.mix_usd };
    });
    const key = st.sort.key, dir = st.sort.dir;
    rows.sort((a, b) => { const va = key === "t" ? a.t : a[key], vb = key === "t" ? b.t : b[key]; if (va == null) return 1; if (vb == null) return -1; return (va < vb ? -1 : va > vb ? 1 : 0) * dir; });
    const tot = {};
    rows.forEach((r) => Object.keys(r.mix).forEach((c) => { tot[c] = (tot[c] || 0) + Math.abs(r.mix[c]); }));
    const order = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
    const top = order.slice(0, 5);
    const color = (c) => "var(--mix" + (top.indexOf(c) >= 0 ? top.indexOf(c) + 1 : 6) + ")";

        : '<div class="pick">' + st.cmp.tickers.map((t) => '<span class="chip">' + t + '<button type="button" data-cdel="' + t + '" aria-label="Remove ' + t + '">×</button></span>').join("") +
          (st.cmp.tickers.length < 6 ? '<form id="cAdd" style="display:flex;gap:6px"><input type="text" id="cIn" list="cList" placeholder="Add ticker" aria-label="Add ticker to compare" maxlength="6" style="width:120px;text-transform:uppercase"><button class="btn" type="submit">Add</button></form><datalist id="cList">' + S.issuers.filter((d) => d.quarters.length).map((d) => '<option value="' + d.ticker + '">' + esc(d.name) + "</option>").join("") + "</datalist>" : '<span class="hint">Six is the most this view compares.</span>') + "</div>") + "</div>";

      (rows.length < 2 && st.cmp.mode === "pick" ? '<div class="panel empty">Add at least two issuers to compare.</div>' :

      rows.map((r) => '<tr class="click" data-t="' + r.t + '"><td><b class="mono">' + r.t + '</b> <span class="muted small">' + esc(r.d.name) + '</span></td><td class="mono">' + (r.q ? short(r.q.period_id) : "—") + '</td><td class="n">' + m(r.rep) + '</td><td class="n">' + m(r.norm) + '</td><td class="n">' + pct(r.gap) + '</td><td class="n">' + pct(r.disc) + "</td><td>" + mixbar(r.mix) + '</td><td><span class="ticks">' + (r.q ? tickHtml(r.q, true) : "") + "</span></td></tr>").join("") +
      '</tbody></table></div><div class="wf-legend" style="padding-top:10px">' + top.map((c) => '<span><i class="sw" style="background:' + color(c) + '"></i>' + esc(c) + " " + esc(codeName(c)) + "</span>").join("") + (order.length > 5 ? '<span><i class="sw" style="background:var(--mix6)"></i>Other</span>' : "") + "</div></div>" +
      '<div><h2 style="margin-bottom:8px">Last 8 quarters, reported and normalized ($m)</h2><div class="sm-grid">' +

  // ------------------------------------------------------------------ method
  function viewMethod() {
    const c = S.coverage, a = c.anchor_checks, h = c.held_out || null, lm = c.label_memory || {};
    const stages = {};
    c.failures.forEach((f) => { stages[f.stage] = (stages[f.stage] || 0) + 1; });

    main.innerHTML = '<div><h1>Method and accuracy</h1><p class="lede">What is checked, what is not yet, and how each number is produced. Every figure on this site comes from deterministic code reading the filing; no language model produces or alters a number.</p></div>' +
      '<div class="strip panel" id="heldout">' +
      (h ? stat(h.bridges_all_periods_tie + " / " + h.bridges_found, "Held-out bridges that tie out", "every period adds up, on " + h.releases + " releases outside the " + h.gold_releases + "-release gold set") : stat("—", "Held-out bridges", "gold set not available to this build")) +
      stat(c.sum_checks.pass.toLocaleString() + " / " + (c.sum_checks.pass + c.sum_checks.fail).toLocaleString(), "Period tie-outs passed", "start plus adjustments equals the stated total") +
      stat(a.pass.toLocaleString() + " / " + (a.pass + a.mismatch).toLocaleString(), "GAAP anchors match XBRL", a.unavailable + " periods have no XBRL fact to compare") +
      stat(c.observations.toLocaleString(), "As-reported values stored", "append-only, each with its sec.gov location") + "</div>" +
      '<div class="cols2"><div class="panel"><div class="panel-h"><h2>How a bridge is verified</h2></div><div class="prose"><ol>' +
      "<li><b>Find the release.</b> Every 8-K reporting Item 2.02 and its EX-99.1 press release, fetched from EDGAR and stored with a sha256.</li>" +
      "<li><b>Pick the headline table.</b> Among tables with an EBITDA total and a GAAP starting line, the one that ties out in every period, covers the quarter just reported and starts from net income.</li>" +
      "<li><b>Tie it out.</b> The starting line plus every adjustment must equal the reported total in each period, within max(1, ⌈n/2⌉) rounding units.</li>" +
      "<li><b>Anchor it.</b> The GAAP starting line must equal the company’s XBRL fact for the same period, from SEC companyfacts.</li>" +

  // ------------------------------------------------------------------ search palette
  const P = { items: [], i: 0 };
  function openPalette() { $("#palette").hidden = false; const q = $("#palq"); q.value = ""; palFill(""); q.focus(); }
  function closePalette() { $("#palette").hidden = true; }
  function palFill(v) {
    const s = v.trim().toLowerCase();
    const score = (d) => (d.ticker.toLowerCase() === s ? 0 : d.ticker.toLowerCase().startsWith(s) ? 1 : d.name.toLowerCase().startsWith(s) ? 2 : 3);
    P.items = S.issuers.filter((d) => !s || d.ticker.toLowerCase().indexOf(s) >= 0 || d.name.toLowerCase().indexOf(s) >= 0).sort((a, b) => score(a) - score(b) || a.ticker.localeCompare(b.ticker)).slice(0, 12);
    P.i = 0; palDraw();
  }
  function palDraw() {
    $("#pall").innerHTML = P.items.length ? P.items.map((d, i) => '<li role="option" aria-selected="' + (i === P.i) + '" class="' + (i === P.i ? "on" : "") + '" data-pi="' + i + '"><b>' + d.ticker + '</b><span class="nm">' + esc(d.name) + '</span><span class="muted small">' + esc(d.sector) + "</span></li>").join("") : '<li class="muted">No issuer matches.</li>';
  }
  function palGo(i) { const d = P.items[i]; if (!d) return; closePalette(); go("issuer", { ticker: d.ticker }); }
  $("#palq").addEventListener("input", (e) => palFill(e.target.value));
  $("#palq").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); P.i = Math.min(P.items.length - 1, P.i + 1); palDraw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); P.i = Math.max(0, P.i - 1); palDraw(); }
    else if (e.key === "Enter") { e.preventDefault(); palGo(P.i); }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  });

      { k: "Source viewer", t: lit ? "Each number opens the table it came from. " + esc(lit.label) + " (" + esc(lit.value_raw) + ") is highlighted in the stored EX-99.1, accession " + esc(q.accession) + "." : "Each number opens the filing table it came from.", run: () => { if (!cc) return; go("issuer", { ticker: "CC", tab: "recasts" }); if (lit) D.timer = setTimeout(() => openViewer("CC", q.period_id, lit.li), 80); } },
      { k: "Recasts", t: rc ? "Chemours restated net income for the quarter ended Jun 30, 2024: " + capM(rc.first_usd) + " in its " + esc(rc.first_filed) + " release, " + capM(rc.latest_usd) + " in its " + esc(rc.latest_filed) + " release. Both observations are kept." : "Restated values are kept as separate observations.", run: () => { if (cc) go("issuer", { ticker: "CC", tab: "recasts", hl: rc ? { period: rc.period_id, label: rc.label } : null }); } },
      { k: "Gaming peers", t: gaming ? gaming.issuers.length + " gaming and leisure issuers side by side. The sector’s median discretionary add-backs are " + pct(gaming.median_addback_intensity) + " of reported EBITDA." : "Peers side by side.", run: () => { st.cmp.mode = "sector"; st.cmp.sector = "Gaming & leisure"; st.sort = { key: "gap", dir: -1 }; go("compare"); } },
      { k: "Method", t: h ? h.bridges_all_periods_tie + " of " + h.bridges_found + " held-out bridges tie out in every period, checked by arithmetic against the filing and XBRL, not by labels." : "How each number is checked.", run: () => { go("method"); D.timer = setTimeout(() => { const el = $("#heldout"); if (el) el.classList.add("callout"); }, 30); } },
    ];
  }
  function demoShow() {
    const steps = demoSteps(), s = steps[D.i];
    clearTimeout(D.timer); closeViewer();
    $("#demoK").textContent = "Demo · " + (D.i + 1) + " of " + steps.length + " · " + s.k;
    $("#demoP").innerHTML = s.t;
    $("#demoPrev").disabled = D.i === 0;
    $("#demoNext").textContent = D.i === steps.length - 1 ? "Finish" : "Next";
    s.run();
  }
  function demoStart() { D.on = true; D.i = 0; $("#demo").hidden = false; demoShow(); $("#demoNext").focus(); }
  function demoEnd() { D.on = false; $("#demo").hidden = true; closeViewer(); }
  $("#demoBtn").onclick = () => (D.on ? demoEnd() : demoStart());
  $("#demoNext").onclick = () => { if (D.i >= demoSteps().length - 1) return demoEnd(); D.i++; demoShow(); };
  $("#demoPrev").onclick = () => { if (D.i > 0) { D.i--; demoShow(); } };
  $("#demoExit").onclick = demoEnd;

  // ------------------------------------------------------------------ theme
  function effectiveDark() { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
  const savedTheme = lsGet("fn-theme", null);
  if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
  $("#themeBtn").onclick = () => { const t = effectiveDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t); lsSet("fn-theme", t); };

  // ------------------------------------------------------------------ events
  $("#openK").onclick = openPalette;
  $("#vClose").onclick = closeViewer;
  $("#vBody").addEventListener("click", (e) => {
    const td = e.target.closest("[data-fn-xp]");
    if (!td || !V.open) return;
    const q = quarter(BY[V.ticker], V.period);
    const l = srcLines(q).find((x) => x.xpath === td.getAttribute("data-fn-xp"));
    if (l) { hlRow(V.li, false); V.li = l.li; showViewer(); }
  });
  document.addEventListener("click", (e) => {
    const src = e.target.closest("[data-src]");
    if (src) { openViewer(st.ticker, st.period, +src.getAttribute("data-src")); return; }
    const wf = e.target.closest(".wf-row");
    if (wf) { const li = wf.getAttribute("data-li"); if (li !== "") openViewer(st.ticker, st.period, +li); return; }
    const qp = e.target.closest("[data-qp]");
    if (qp) { go("issuer", { ticker: st.ticker, period: qp.getAttribute("data-qp"), tab: st.tab }); return; }
    const pol = e.target.closest("[data-policy]");
    if (pol) { st.policy = pol.getAttribute("data-policy"); render(); return; }
    const tab = e.target.closest("[data-tab]");
    if (tab) { st.tab = tab.getAttribute("data-tab"); $("#lower").innerHTML = lowerTabs(BY[st.ticker]); return; }
    const fold = e.target.closest("[data-fold]");
    if (fold) { const k = fold.getAttribute("data-fold"); st.open[k] = !st.open[k]; viewChanges(); return; }
    const more = e.target.closest("[data-more]");
    if (more) { st.days += 30; viewChanges(); return; }
    const un = e.target.closest("[data-unwatch]");
    if (un) { WATCH = WATCH.filter((t) => t !== un.getAttribute("data-unwatch")); lsSet("fn-watch", WATCH); refreshRail(); return; }
    const so = e.target.closest("[data-sort]");
    if (so) { const k = so.getAttribute("data-sort"); st.sort = { key: k, dir: st.sort.key === k ? -st.sort.dir : k === "t" ? 1 : -1 }; viewCompare(); return; }
    const cm = e.target.closest("[data-cmode]");
    if (cm) { st.cmp.mode = cm.getAttribute("data-cmode"); viewCompare(); return; }
    const cd = e.target.closest("[data-cdel]");
    if (cd) { st.cmp.tickers = st.cmp.tickers.filter((t) => t !== cd.getAttribute("data-cdel")); viewCompare(); return; }
    if (e.target.closest("a[href^='http']")) return;
    const c = e.target.closest(".card[data-k]");
    if (c) { st.sel = +c.getAttribute("data-k"); openChange(VIS[st.sel]); return; }
    const t = e.target.closest("[data-t]");
    if (t) { go("issuer", { ticker: t.getAttribute("data-t") }); return; }
  });
  main.addEventListener("mouseover", (e) => {
    const r = e.target.closest(".wf-row[data-li], tr[data-li]");
    if (r && r.getAttribute("data-li") !== "") hlRow(r.getAttribute("data-li"), true);
  });
  main.addEventListener("mouseout", (e) => {
    const r = e.target.closest(".wf-row[data-li], tr[data-li]");
    if (r && r.getAttribute("data-li") !== "" && !(V.open && String(V.li) === r.getAttribute("data-li"))) hlRow(r.getAttribute("data-li"), false);
  });
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
    if (!$("#palette").hidden) return;
    if (V.open) {
      if (k === "Escape") { e.preventDefault(); closeViewer(); return; }
      if (k === "ArrowDown" || k === "ArrowRight") { e.preventDefault(); stepViewer(1); return; }
      if (k === "ArrowUp" || k === "ArrowLeft") { e.preventDefault(); stepViewer(-1); return; }
    }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "");
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === "Escape" && D.on) { demoEnd(); return; }
    if (k === "/") { e.preventDefault(); openPalette(); return; }
    if (st.view === "changes") {
      if (k === "j" || k === "J") { e.preventDefault(); moveSel(1); }
      else if (k === "k" || k === "K") { e.preventDefault(); moveSel(-1); }
      else if (k === "Enter" && st.sel >= 0 && VIS[st.sel] && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("a,button"))) { e.preventDefault(); openChange(VIS[st.sel]); }
    }
    if (k === "Enter" && document.activeElement && document.activeElement.matches("[data-t][role=link]")) go("issuer", { ticker: document.activeElement.getAttribute("data-t") });
  });

  function boot(data) {
    S = data; CODES = (S.policy && S.policy.codes) || {};
    S.issuers.forEach((d) => { BY[d.ticker] = d; });
    WATCH = WATCH.filter((t) => BY[t]).slice(0, 10);
    fromHash();
  }
  fetch("snapshot.json").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(boot)
    .catch((e) => { main.innerHTML = '<div class="panel"><div class="panel-h"><h2>The data did not load</h2></div><p class="prose">snapshot.json could not be read (' + esc(e.message) + '). Run the API with <span class="mono">uvicorn app.api.main:app</span> from backend/, or rebuild the static export with <span class="mono">python -m app.pipeline.cli export</span>.</p></div>'; });
})();
</script>
