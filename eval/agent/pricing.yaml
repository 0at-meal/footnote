# USD per million tokens, used by the Track A harness to cost every model call
# and enforce the run budget (tools/agent_eval/run.py). A model missing here
# cannot be run: the harness never assumes a price.
#
# Source: the claude-api skill's model table ("cached: 2026-10-06"), read
# 2026-10-24. Cache reads for Opus 5.5 and Sonnet 5.5 are stated there ($0.20).
# Derived, not stated: cache writes at 1.25x input (the documented 5-minute
# write multiplier) and the Haiku 5.5 cache read at 0.1x input. Haiku 5.5 rates
# apply to prompts up to 100K tokens. Re-check against the official pricing
# page before a paid run.
source: claude-api skill model table (cached 2026-10-06), read 2026-10-24
models:
  claude-opus-5-5:
    input: "4.00"
    output: "20.00"
    cache_read: "0.20"
    cache_write: "5.00"
  claude-sonnet-5-5:
    input: "2.00"
    output: "10.00"
    cache_read: "0.20"
    cache_write: "2.50"
  claude-haiku-5-5:
    input: "0.10"
    output: "0.50"
    cache_read: "0.01"
    cache_write: "0.125"
