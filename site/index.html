<style>
/* Layout: a credit terminal. Sticky top bar; the working area is a dense worksheet of 32px rows,
   figures in mono with auditor tick marks; filings open in a source panel from the right. */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --sunk: #eceef2;
  --ink: #14213d;
  --muted: #5a6478;
  --rule: #dde1e8;
  --rule-strong: #c3c9d4;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e6ecfb;
  --ok: #12734a;
  --ok-soft: #e1f1e9;
  --warn: #9a5a00;
  --warn-soft: #fbefd8;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --kept: #9aa3b2;
  --mix1: #14213d; --mix2: #1f4fd1; --mix3: #7d9be6; --mix4: #5a6478; --mix5: #b9c7ec; --mix6: #c3c9d4;
  --shadow: 0 12px 40px rgba(20, 33, 61, 0.18);
  --font-ui: "Libre Franklin", "Franklin Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --row: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1320; --panel: #141c2d; --sunk: #10182a; --ink: #e3e8f1; --muted: #93a0b5; --rule: #243049; --rule-strong: #34425f;
    --accent: #7ea2ff; --accent-ink: #0d1320; --accent-soft: #1b2a4d; --ok: #5fd39a; --ok-soft: #10301f; --warn: #f0b456; --warn-soft: #33270f;
    --bad: #ff8a80; --bad-soft: #3a1714; --kept: #5d6880;
    --mix1: #e3e8f1; --mix2: #7ea2ff; --mix3: #4a69b8; --mix4: #a9b4c8; --mix5: #33456e; --mix6: #66728a;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1320; --panel: #141c2d; --sunk: #10182a; --ink: #e3e8f1; --muted: #93a0b5; --rule: #243049; --rule-strong: #34425f;
  --accent: #7ea2ff; --accent-ink: #0d1320; --accent-soft: #1b2a4d; --ok: #5fd39a; --ok-soft: #10301f; --warn: #f0b456; --warn-soft: #33270f;
  --bad: #ff8a80; --bad-soft: #3a1714; --kept: #5d6880;
  --mix1: #e3e8f1; --mix2: #7ea2ff; --mix3: #4a69b8; --mix4: #a9b4c8; --mix5: #33456e; --mix6: #66728a;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .n, .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* ---------- top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--rule); }

      <dl id="vMeta"></dl>
    </div>
    <a class="btn" id="vSec" href="#" target="_blank" rel="noopener">Open on sec.gov ↗</a>
    <button type="button" class="btn icon-btn" id="vClose" aria-label="Close source viewer">✕</button>
  </div>
  <div class="v-line" id="vLine"></div>
  <div class="v-body" id="vBody"></div>
</aside>

<div class="pal-back" id="palette" hidden>
  <div class="pal" role="dialog" aria-label="Search issuers">
    <input id="palq" type="text" placeholder="Search by ticker or name" autocomplete="off" spellcheck="false" aria-label="Search by ticker or name">
    <ul id="pall" role="listbox"></ul>
    <div class="foot">↑ ↓ to move · Enter to open · Esc to close</div>
  </div>
</div>

<div class="demo" id="demo" hidden role="region" aria-label="Guided demo">
  <div class="k" id="demoK"></div>
  <p id="demoP"></p>
  <div class="ctl"><button type="button" id="demoExit">Exit</button><button type="button" id="demoPrev">Back</button><button type="button" class="go" id="demoNext">Next</button></div>
</div>

<script>
(() => {
  "use strict";
  let S = null, CODES = {}, BY = {};
  const MULT = { units: 1, thousands: 1e3, millions: 1e6, billions: 1e9 };
  const WATCH_DEFAULT = ["CC", "CZR", "MGM", "PENN", "WYNN", "CHTR", "LUMN", "CCL", "HTZ", "BHC"];
  const st = {
    view: "changes", ticker: null, period: null, tab: "recasts", policy: "v01", hl: null,
    f: { type: "", sector: "", watch: false, min: 0 }, sel: -1, open: {}, days: 30,
    cmp: { mode: "sector", sector: "Gaming & leisure", tickers: ["CZR", "MGM", "PENN"] },
    sort: { key: "gap", dir: -1 }, usector: "", uq: "",
  };
  let VIS = [];
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const main = $("#main");

  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory only */ } }
  let WATCH = lsGet("fn-watch", WATCH_DEFAULT);

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  // USD millions, one decimal, negatives in parentheses.
  function m(v, dp) {
    if (v == null || isNaN(v)) return "—";
    const x = v / 1e6, a = Math.abs(x), d = dp == null ? 1 : dp;
    const s = a.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
    return x < 0 ? "(" + s + ")" : s;
  }
  function capM(v) {
    if (v == null) return "—";
    const a = Math.abs(v) / 1e6;
    const s = "$" + (a >= 10 ? Math.round(a).toLocaleString("en-US") : a.toFixed(1)) + "m";
    return v < 0 ? "(" + s + ")" : s;
  }
  function pct(v) { if (v == null || isNaN(v)) return "—"; const s = Math.abs(v * 100).toFixed(1) + "%"; return v < 0 ? "(" + s + ")" : s; }
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function pp(pid) { const i = pid.indexOf("-"); const d = pid.slice(i + 1).split("-"); return { months: +pid.slice(0, i - 1), y: d[0], m: +d[1], day: +d[2] }; }
  function qlabel(pid) { const p = pp(pid); return (p.months === 3 ? "" : p.months + " months to ") + MON[p.m - 1] + " " + p.day + ", " + p.y; }
  function short(pid) { const p = pp(pid); const b = MON[p.m - 1] + " ’" + p.y.slice(2); return p.months === 3 ? b : p.months + "M " + b; }
  function dlabel(iso) { const d = new Date(iso + "T00:00:00Z"); return DOW[d.getUTCDay()] + " " + MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear(); }
  function ext(url, text, title) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener"' + (title ? ' title="' + esc(title) + '"' : "") + ">" + (text || "sec.gov ↗") + "</a>" : '<span class="muted">no link</span>'; }
  function latest(d) { return d.quarters.length ? d.quarters[d.quarters.length - 1] : null; }
  function quarter(d, pid) { return (pid && d.quarters.find((q) => q.period_id === pid)) || latest(d); }
  function threeM(d) { return d.quarters.filter((q) => pp(q.period_id).months === 3 && q.reported_usd != null); }
  function sumOk(q) { const c = q.sum_check; return !!c && Math.abs(Number(c.expected) - Number(c.computed)) <= Number(c.tolerance); }
  function checks(q) {
    const s = !q.sum_check ? ["warn", "○", "no sum check", "No sum check was run for this period"]
      : sumOk(q) ? ["ok", "✓", "adds up", "Start plus every adjustment equals the stated total (" + q.sum_check.computed + " vs " + q.sum_check.expected + ", tolerance " + q.sum_check.tolerance + ")"]
      : ["bad", "✗", "does not add up", "Start plus adjustments is " + q.sum_check.computed + ", the filing states " + q.sum_check.expected];
    const a = q.anchor_status === "pass" ? ["ok", "✓", "matches XBRL", "The GAAP starting line equals the company's XBRL fact for this period"]
      : q.anchor_status === "mismatch" ? ["bad", "✗", "differs from XBRL", "The GAAP starting line differs from the company's XBRL fact"]
      : ["warn", "○", "no XBRL fact", "XBRL has no comparable fact for this period"];
    return { s, a };
  }
  function tickHtml(q, compact) {
    const c = checks(q);
    return [c.s, c.a].map((t) => '<span class="tick ' + t[0] + '" title="' + esc(t[3]) + '"><b>' + t[1] + "</b>" + (compact ? "" : " " + t[2]) + "</span>").join("");
  }
  function codeName(c) { return CODES[c] ? CODES[c].name : c; }
  function nice(r) { const e = Math.pow(10, Math.floor(Math.log10(r || 1))); const f = r / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }
  function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }

  // Bridge lines joined to their normalization (category, treatment) by label + as-shown value.
  function enrich(q) {
    if (q._en) return q._en;
    const pool = {};
    q.normalization.lines.forEach((n) => { const k = n.label + "|" + n.value_raw; (pool[k] = pool[k] || []).push(n); });
    q._en = q.lines.map((l, i) => Object.assign({}, l, { li: i, n: l.role === "adjustment" ? ((pool[l.label + "|" + l.value_raw] || []).shift() || null) : null }));
    return q._en;
  }
  function lineUsd(l) { return l.value_usd == null ? null : l.sign * l.value_usd; }

  // ------------------------------------------------------------------ routing
  const VIEWS = ["changes", "issuers", "compare", "method"];
  function tok() { return st.view === "issuer" ? st.ticker + (st.period ? "_" + st.period : "") : st.view; }
  function go(view, o) {
    o = o || {};
    st.view = view;
    if (view === "issuer") { st.ticker = o.ticker; st.period = o.period || null; st.hl = o.hl || null; st.tab = o.tab || st.tab; }
    if (!o.keepViewer) closeViewer();
    const t = tok();
    if (decodeURIComponent(location.hash.slice(1)) !== t) location.hash = t;
    else { render(); if (!keepPlace()) window.scrollTo(0, 0); }
  }
  function keepPlace() { return st.view === "issuer" && !!st.hl; }
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (VIEWS.indexOf(h) >= 0) st.view = h;
    else if (h) {
      const i = h.indexOf("_"), t = (i < 0 ? h : h.slice(0, i)).toUpperCase(), p = i < 0 ? null : h.slice(i + 1);
      if (BY[t]) { if (st.ticker !== t) { st.hl = null; } st.view = "issuer"; st.ticker = t; st.period = p && BY[t].quarters.some((q) => q.period_id === p) ? p : null; }
      else st.view = "changes";
    } else st.view = "changes";
    render();
  }
  window.addEventListener("hashchange", () => { if (!S) return; fromHash(); if (!keepPlace()) window.scrollTo(0, 0); });

  function render() {
    const tabv = st.view === "issuer" ? "issuers" : st.view;
    $$("#tabs a").forEach((a) => a.classList.toggle("on", a.getAttribute("data-v") === tabv));
    if (st.view === "issuer" && BY[st.ticker]) return viewIssuer(BY[st.ticker]);
    if (st.view === "issuers") return viewIssuers();
    if (st.view === "compare") return viewCompare();
    if (st.view === "method") return viewMethod();
    st.view = "changes";
    return viewChanges();
  }

  // ------------------------------------------------------------------ changes inbox
  const TYPES = {
    recast: { name: "Recast", cls: "t-red" },
    recurring_addback: { name: "Recurring “one-off”", cls: "t-amber" },
    added: { name: "Add-back added", cls: "t-blue" },
    removed: { name: "Add-back dropped", cls: "t-blue" },
    metric_renamed: { name: "Metric renamed", cls: "t-grey" },
    renamed: { name: "Line renamed", cls: "t-grey", fold: true },
    layout_changed: { name: "New layout", cls: "t-grey", fold: true },
  };
  const FT = { "": null, recast: ["recast"], recurring: ["recurring_addback"], addrop: ["added", "removed"], renamed: ["renamed", "metric_renamed", "layout_changed"] };
  const FT_NAMES = { "": "All change types", recast: "Recasts", recurring: "Recurring “one-offs”", addrop: "Added or dropped", renamed: "Renamed" };
  const MINS = [0, 1e6, 5e6, 10e6, 25e6, 100e6];

  function changeDesc(i) {
    const per = i.period_id ? qlabel(i.period_id) : "";
    if (i.type === "recast") return esc(i.label) + " for the " + (pp(i.period_id).months === 3 ? "quarter ended " : "") + esc(per) + ", first reported " + esc(i.first_filed);
    if (i.type === "recurring_addback") return esc(i.label) + ' <span class="chip code" title="' + esc(codeName(i.code)) + '">' + esc(i.code) + "</span> called non-recurring, seen in 3 of the last 4 quarters";
    if (i.type === "added") return "New add-back: " + esc(i.label);
    if (i.type === "removed") return "Add-back no longer shown: " + esc(i.label);
    if (i.type === "metric_renamed") return "Headline metric renamed: " + esc(i.prior_label) + " → " + esc(i.label);
    if (i.type === "layout_changed") return "Bridge layout changed: " + esc(i.value_raw);
    return esc(i.prior_label) + " → " + esc(i.label);
  }
  function changeNums(i) {
    if (i.before_usd == null && i.after_usd == null) return i.value_raw && i.type === "renamed" ? '<span class="muted">' + esc(i.value_raw) + "</span>" : "";
    const d = i.delta_usd;
    if (i.type === "recurring_addback") return m(i.after_usd) + '<span class="dl">$m this quarter</span>';
    return m(i.before_usd) + '<span class="arrow">→</span>' + m(i.after_usd) + '<span class="dl">Δ ' + (d != null && d > 0 ? "+" : "") + m(d) + " $m</span>";
  }
  function changeUrl(i) { return i.type === "recast" ? i.latest_url : i.url; }

  function filteredFeed() {
    const types = FT[st.f.type];
    const sectorOf = (t) => (BY[t] ? BY[t].sector : "");
    return S.feed.filter((i) =>
      (!types || types.indexOf(i.type) >= 0) &&
      (!st.f.sector || sectorOf(i.ticker) === st.f.sector) &&
      (!st.f.watch || WATCH.indexOf(i.ticker) >= 0) &&
      (!st.f.min || (i.impact_usd != null && i.impact_usd >= st.f.min)));
  }
  function headline() {
    const asOf = S.generated_at.slice(0, 10);
    const from = new Date(Date.parse(asOf + "T00:00:00Z") - 6 * 864e5).toISOString().slice(0, 10);
    let rel = 0, relOk = 0;
    S.issuers.forEach((d) => d.releases.forEach((r) => { if (r.filed >= from && r.filed <= asOf) { rel++; if (r.status !== "not_found") relOk++; } }));
    const nRec = S.feed.filter((i) => i.type === "recast").length;
    const recIss = new Set(S.feed.filter((i) => i.type === "recast").map((i) => i.ticker)).size;
    const nRecur = S.feed.filter((i) => i.type === "recurring_addback").length;
    const recurIss = new Set(S.feed.filter((i) => i.type === "recurring_addback").map((i) => i.ticker)).size;
    const c = S.coverage;
    const stat = (v, l, d) => '<div class="stat"><span class="v">' + v + '</span><span class="l">' + l + '</span><span class="d">' + d + "</span></div>";
    return '<div class="strip">' +
      stat(rel, "Releases this week", relOk + " with a bridge · " + MON[+from.slice(5, 7) - 1] + " " + +from.slice(8) + "–" + MON[+asOf.slice(5, 7) - 1] + " " + +asOf.slice(8)) +
      stat(nRec, "Recasts", "restated prior-period values at " + recIss + " issuers") +
      stat(nRecur, "Recurring “one-offs”", "non-recurring add-backs in 3 of 4 quarters, " + recurIss + " issuers") +
      stat(pct(c.bridges_found ? c.bridges_all_periods_tie / c.bridges_found : null), "Tie-out rate", c.bridges_all_periods_tie + " of " + c.bridges_found + " bridges add up in every period") +
      "</div>";
  }
  function card(i, k) {
    const T = TYPES[i.type] || { name: i.type, cls: "t-grey" };
    return '<article class="card ' + T.cls + (k === st.sel ? " sel" : "") + '" data-k="' + k + '" tabindex="-1">' +
      '<span class="strip-c"></span><span class="tk">' + esc(i.ticker) + "</span>" +
      '<div class="body"><span class="type">' + T.name + (i.period_id ? ' <span class="muted mono" style="text-transform:none;letter-spacing:0;font-weight:400">· ' + short(i.period_id) + "</span>" : "") + '</span><span class="desc">' + changeDesc(i) + "</span></div>" +
      '<div class="nums">' + changeNums(i) + "</div>" +
      '<span class="src">' + ext(changeUrl(i), "source ↗", "Open the line on sec.gov") + "</span></article>";
  }
  function viewChanges() {
    const items = filteredFeed();
    const byDay = {};
    items.forEach((i) => { const k = i.filed || "unknown"; (byDay[k] = byDay[k] || []).push(i); });
    const days = Object.keys(byDay).sort().reverse();
    VIS = [];
    const imp = (i) => (i.impact_usd == null ? -1 : i.impact_usd);
    const groups = days.slice(0, st.days).map((day) => {
      const list = byDay[day].slice().sort((a, b) => imp(b) - imp(a));
      const shown = list.filter((i) => !(TYPES[i.type] || {}).fold);
      const folded = list.filter((i) => (TYPES[i.type] || {}).fold);
      let h = '<section class="day"><div class="day-h"><span class="mono">' + (day === "unknown" ? "Filing date unknown" : dlabel(day)) + "</span><span>" + list.length + " change" + (list.length === 1 ? "" : "s") + "</span></div>";
      shown.forEach((i) => { h += card(i, VIS.length); VIS.push(i); });
      if (folded.length) {
        const open = !!st.open[day];
        h += '<button type="button" class="fold" data-fold="' + day + '" aria-expanded="' + open + '">' + (open ? "▾ Hide " : "▸ Show ") + folded.length + " renamed line" + (folded.length === 1 ? "" : "s") + "</button>";
        if (open) folded.forEach((i) => { h += card(i, VIS.length); VIS.push(i); });
      }
      return h + "</section>";
    }).join("");
    if (st.sel >= VIS.length) st.sel = VIS.length - 1;
    const sectors = Array.from(new Set(S.issuers.map((d) => d.sector).filter(Boolean))).sort();
    main.innerHTML =
      '<div><h1>What changed in the bridges</h1><p class="lede">Restated prior periods, add-backs that appear or vanish, renamed metrics, and “non-recurring” items that keep recurring, read from every earnings release and ranked by dollar impact.</p></div>' +
      '<div class="inbox"><div class="inbox-main">' + headline() +
      '<div class="filters">' +
      '<select id="fType" aria-label="Change type">' + Object.keys(FT).map((k) => '<option value="' + k + '"' + (st.f.type === k ? " selected" : "") + ">" + FT_NAMES[k] + "</option>").join("") + "</select>" +
      '<select id="fSector" aria-label="Sector"><option value="">All sectors</option>' + sectors.map((s) => "<option" + (st.f.sector === s ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select>" +
      '<select id="fMin" aria-label="Minimum dollar impact">' + MINS.map((v) => '<option value="' + v + '"' + (st.f.min === v ? " selected" : "") + ">" + (v ? "Impact ≥ " + capM(v) : "Any impact") + "</option>").join("") + "</select>" +
      '<label><input type="checkbox" id="fWatch"' + (st.f.watch ? " checked" : "") + "> Watchlist only</label>" +
      '<span class="count">' + items.length + " changes<span class=\"kb\"> · <kbd>J</kbd> <kbd>K</kbd> to move, <kbd>Enter</kbd> to open</span></span></div>" +
      (groups || '<div class="panel empty">No changes match these filters.</div>') +
      (days.length > st.days ? '<button type="button" class="btn more" data-more="1">Show earlier filing dates (' + (days.length - st.days) + " more)</button>" : "") +
      "</div>" + '<aside class="rail" id="rail">' + watchRail() + "</aside></div>";
    $("#fType").onchange = (e) => { st.f.type = e.target.value; st.sel = -1; viewChanges(); };
    $("#fSector").onchange = (e) => { st.f.sector = e.target.value; st.sel = -1; viewChanges(); };
    $("#fMin").onchange = (e) => { st.f.min = +e.target.value; st.sel = -1; viewChanges(); };
    $("#fWatch").onchange = (e) => { st.f.watch = e.target.checked; st.sel = -1; viewChanges(); };
    bindWatch();
  }
  function watchRail() {
    const rows = WATCH.filter((t) => BY[t]).map((t) => {
      const d = BY[t], q = latest(d);
      const n = S.feed.filter((i) => i.ticker === t && !(TYPES[i.type] || {}).fold).length;
      return '<li><span class="t" data-t="' + t + '" role="link" tabindex="0">' + t + '</span><span class="nm" title="' + esc(d.name) + '">' + (q ? n + " changes · " + short(q.period_id) : "no bridge yet") + "</span>" +
        '<span class="ticks">' + (q ? tickHtml(q, true) : "") + "</span>" +
        '<button type="button" class="x" data-unwatch="' + t + '" aria-label="Remove ' + t + ' from watchlist">×</button></li>';
    }).join("");
    return '<div class="panel watch"><div class="panel-h"><h2>Watchlist</h2><span class="hint">✓ adds up · ✓ matches XBRL</span></div><ul>' + (rows || '<li class="muted" style="grid-template-columns:1fr">Add tickers below.</li>') + "</ul>" +
      '<form id="wAdd"><input type="text" id="wIn" list="tickerList" placeholder="Add ticker" aria-label="Add ticker to watchlist" maxlength="6"><button class="btn" type="submit">Add</button></form>' +
      '<datalist id="tickerList">' + S.issuers.map((d) => '<option value="' + d.ticker + '">' + esc(d.name) + "</option>").join("") + "</datalist></div>" +
      '<p class="hint" style="margin:0">Kept in this browser only. ' + WATCH.length + " of 10 slots used.</p>";
  }
  function bindWatch() {
    const f = $("#wAdd");
    if (!f) return;
    f.onsubmit = (e) => {
      e.preventDefault();
      const t = $("#wIn").value.trim().toUpperCase();
      if (!BY[t]) { toast(t ? t + " is not in the coverage universe" : "Type a ticker"); return; }
      if (WATCH.indexOf(t) >= 0) { toast(t + " is already on the watchlist"); return; }
      if (WATCH.length >= 10) { toast("The watchlist holds 10 tickers. Remove one first."); return; }
      WATCH.push(t); lsSet("fn-watch", WATCH); refreshRail();
    };
  }
  function refreshRail() { if (st.view === "changes") { if (st.f.watch) viewChanges(); else { $("#rail").innerHTML = watchRail(); bindWatch(); } } }
  function moveSel(d) {
    if (!VIS.length) return;
    st.sel = Math.max(0, Math.min(VIS.length - 1, st.sel + d));
    $$(".card.sel").forEach((c) => c.classList.remove("sel"));
    const el = $('.card[data-k="' + st.sel + '"]');
    if (el) { el.classList.add("sel"); el.scrollIntoView({ block: "nearest" }); }
  }
  function openChange(i) {
    const d = BY[i.ticker];
    if (!d) return;
    const has = i.period_id && d.quarters.some((q) => q.period_id === i.period_id);
    const tab = i.type === "recast" ? "recasts" : i.type === "recurring_addback" ? st.tab : "changes";
    const hl = { type: i.type, period: i.period_id, label: i.label, accession: i.accession || i.latest_accession };
    go("issuer", { ticker: i.ticker, period: i.type === "recast" ? null : has ? i.period_id : null, hl, tab });
  }

  // ------------------------------------------------------------------ issuer
  function viewIssuer(d) {
    const q = quarter(d, st.period);
    const crumbs = '<nav class="crumbs" aria-label="Breadcrumb"><a href="#issuers">Issuers</a><span class="sep">/</span><span>' + esc(d.sector || "Other") + '</span><span class="sep">/</span><a href="#' + d.ticker + '">' + d.ticker + "</a>" + (q ? '<span class="sep">/</span><span class="mono">Quarter ended ' + esc(qlabel(q.period_id)) + "</span>" : "") + "</nav>";
    const title = '<div><div class="eyebrow">' + esc(d.sector) + " · CIK " + esc(d.cik) + "</div><h1>" + d.ticker + ' <span style="font-weight:400">' + esc(d.name) + "</span></h1></div>";
    if (!q) {
      main.innerHTML = crumbs + '<div class="ihead">' + title + '</div><div class="panel"><div class="empty">No verified quarterly bridge yet. Each release read and the reason it did not yield a bridge are listed below.</div></div><div class="panel">' + releasesTable(d) + "</div>";
      return;
    }
    const n = q.normalization;
    const diff = q.normalized_usd == null || q.reported_usd == null ? null : q.normalized_usd - q.reported_usd;
    const qsel = '<select id="qSel" aria-label="Quarter">' + d.quarters.slice().reverse().map((x) => '<option value="' + x.period_id + '"' + (x.period_id === q.period_id ? " selected" : "") + ">" + esc(qlabel(x.period_id)) + "</option>").join("") + "</select>";
    main.innerHTML = crumbs +
      '<div class="ihead">' + title + '<div class="ctl">' + qsel +
      '<div class="seg" role="group" aria-label="Normalization policy"><button type="button" data-policy="v01" class="' + (st.policy === "v01" ? "on" : "") + '">Footnote v0.1</button><button type="button" data-policy="asrep" class="' + (st.policy === "asrep" ? "on" : "") + '">As reported</button></div>' +

  function lineChart(qs, o) {

      const d = BY[t], q = latest(d), p = peerRow(t) || { mix_usd: {} };
      const rep = q ? q.reported_usd : null, norm = q ? q.normalized_usd : null;
      return { t, d, q, rep, norm, gap: rep && norm != null ? (rep - norm) / Math.abs(rep) : null, disc: q ? q.addback_intensity : null, mix: p.mix_usd };
    });
    const key = st.sort.key, dir = st.sort.dir;
    rows.sort((a, b) => { const va = key === "t" ? a.t : a[key], vb = key === "t" ? b.t : b[key]; if (va == null) return 1; if (vb == null) return -1; return (va < vb ? -1 : va > vb ? 1 : 0) * dir; });
    const tot = {};

      (rows.length < 2 && st.cmp.mode === "pick" ? '<div class="panel empty">Add at least two issuers to compare.</div>' :

    main.innerHTML = '<div><h1>Method and accuracy</h1><p class="lede">What is checked, what is not yet, and how each number is produced. Every figure on this site comes from deterministic code reading the filing; no language model produces or alters a number.</p></div>' +
      '<div class="strip panel" id="heldout">' +
      (h ? stat(h.bridges_all_periods_tie + " / " + h.bridges_found, "Held-out bridges that tie out", "every period adds up, on " + h.releases + " releases outside the " + h.gold_releases + "-release gold set") : stat("—", "Held-out bridges", "gold set not available to this build")) +
      stat(c.sum_checks.pass.toLocaleString() + " / " + (c.sum_checks.pass + c.sum_checks.fail).toLocaleString(), "Period tie-outs passed", "start plus adjustments equals the stated total") +
      stat(a.pass.toLocaleString() + " / " + (a.pass + a.mismatch).toLocaleString(), "GAAP anchors match XBRL", a.unavailable + " periods have no XBRL fact to compare") +
      stat(c.observations.toLocaleString(), "As-reported values stored", "append-only, each with its sec.gov location") + "</div>" +
      '<div class="cols2"><div class="panel"><div class="panel-h"><h2>How a bridge is verified</h2></div><div class="prose"><ol>' +
      "<li><b>Find the release.</b> Every 8-K reporting Item 2.02 and its EX-99.1 press release, fetched from EDGAR and stored with a sha256.</li>" +
      "<li><b>Pick the headline table.</b> Among tables with an EBITDA total and a GAAP starting line, the one that ties out in every period, covers the quarter just reported and starts from net income.</li>" +
      "<li><b>Tie it out.</b> The starting line plus every adjustment must equal the reported total in each period, within max(1, ⌈n/2⌉) rounding units.</li>" +
      "<li><b>Anchor it.</b> The GAAP starting line must equal the company’s XBRL fact for the same period, from SEC companyfacts.</li>" +

    if (un) { WATCH = WATCH.filter((t) => t !== un.getAttribute("data-unwatch")); lsSet("fn-watch", WATCH); refreshRail(); return; }
    const so = e.target.closest("[data-sort]");
    if (so) { const k = so.getAttribute("data-sort"); st.sort = { key: k, dir: st.sort.key === k ? -st.sort.dir : k === "t" ? 1 : -1 }; viewCompare(); return; }
    const cm = e.target.closest("[data-cmode]");
    if (cm) { st.cmp.mode = cm.getAttribute("data-cmode"); viewCompare(); return; }
    const cd = e.target.closest("[data-cdel]");
    if (cd) { st.cmp.tickers = st.cmp.tickers.filter((t) => t !== cd.getAttribute("data-cdel")); viewCompare(); return; }
    if (e.target.closest("a[href^='http']")) return;
    const c = e.target.closest(".card[data-k]");
    if (c) { st.sel = +c.getAttribute("data-k"); openChange(VIS[st.sel]); return; }
    const t = e.target.closest("[data-t]");
    if (t) { go("issuer", { ticker: t.getAttribute("data-t") }); return; }
  });
  main.addEventListener("mouseover", (e) => {
    const r = e.target.closest(".wf-row[data-li], tr[data-li]");
    if (r && r.getAttribute("data-li") !== "") hlRow(r.getAttribute("data-li"), true);
  });
  main.addEventListener("mouseout", (e) => {
    const r = e.target.closest(".wf-row[data-li], tr[data-li]");
    if (r && r.getAttribute("data-li") !== "" && !(V.open && String(V.li) === r.getAttribute("data-li"))) hlRow(r.getAttribute("data-li"), false);
  });
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
    if (!$("#palette").hidden) return;
    if (V.open) {
      if (k === "Escape") { e.preventDefault(); closeViewer(); return; }
      if (k === "ArrowDown" || k === "ArrowRight") { e.preventDefault(); stepViewer(1); return; }
      if (k === "ArrowUp" || k === "ArrowLeft") { e.preventDefault(); stepViewer(-1); return; }
    }
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "");
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === "Escape" && D.on) { demoEnd(); return; }
    if (k === "/") { e.preventDefault(); openPalette(); return; }
    if (st.view === "changes") {
      if (k === "j" || k === "J") { e.preventDefault(); moveSel(1); }
      else if (k === "k" || k === "K") { e.preventDefault(); moveSel(-1); }
      else if (k === "Enter" && st.sel >= 0 && VIS[st.sel] && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("a,button"))) { e.preventDefault(); openChange(VIS[st.sel]); }
    }
    if (k === "Enter" && document.activeElement && document.activeElement.matches("[data-t][role=link]")) go("issuer", { ticker: document.activeElement.getAttribute("data-t") });
  });

  function boot(data) {
    S = data; CODES = (S.policy && S.policy.codes) || {};
    S.issuers.forEach((d) => { BY[d.ticker] = d; });
    WATCH = WATCH.filter((t) => BY[t]).slice(0, 10);
    fromHash();
  }
  fetch("snapshot.json").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(boot)
    .catch((e) => { main.innerHTML = '<div class="panel"><div class="panel-h"><h2>The data did not load</h2></div><p class="prose">snapshot.json could not be read (' + esc(e.message) + '). Run the API with <span class="mono">uvicorn app.api.main:app</span> from backend/, or rebuild the static export with <span class="mono">python -m app.pipeline.cli export</span>.</p></div>'; });
})();
</script>
</body></html>
